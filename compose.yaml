services:
  # Server API;
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: server
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD-SHELL",
        "SCHEME=$([ \"$$HTTPS\" = \"true\" ] && echo \"https\" || echo \"http\"); wget --no-verbose --tries=1 --no-check-certificate --spider $$SCHEME://localhost:${SERVER_PORT}/api/v1/health || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Server microservices;
  rabbitmq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: rabbitmq-worker
    # Modify start command for rmq microservice need;
    command: [ "node", "server/dist/src/microservice.rmq.js" ]
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    restart: always
    image: postgres:16.4
    container_name: db
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}
    env_file:
      - ./.env
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./init/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  db_test:
    restart: always
    image: postgres:16.4
    container_name: db_test
    ports:
      - ${TEST_DATABASE_PORT}:${DATABASE_PORT} # leave the inner port unchanged;
    environment:
      POSTGRES_USER: ${TEST_DATABASE_USER}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD}
      POSTGRES_DB: ${TEST_DATABASE_NAME}
    volumes:
      - ./db_data_test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "psql -U ${TEST_DATABASE_USER} -d ${TEST_DATABASE_NAME} -c 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    restart: always
    image: redis:8.2.2
    container_name: redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    env_file:
      - ./.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  #  keycloak:
  #    restart: always
  #    image: quay.io/keycloak/keycloak:26.3.0
  #    container_name: keycloak
  #    command: start
  #    ports:
  #      - ${KC_PORT}:${KC_PORT}
  #    env_file:
  #      - ./.env
  #    volumes:
  #      - ./certs/???:/opt/keycloak/conf/certs:ro
  #    depends_on:
  #      - db
  #    healthcheck:
  #      test: [ "CMD", "curl", "-f", "http://${KC_HOSTNAME}:${KC_PORT}/auth/realms/master" ]
  #      interval: 10s
  #      timeout: 5s
  #      retries: 3

  rabbitmq:
    restart: always
    image: rabbitmq:4.1.4-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - ${RABBITMQ_PORT}:${RABBITMQ_PORT}
      - ${RABBITMQ_WEBCLIENT_PORT}:${RABBITMQ_WEBCLIENT_PORT}
    env_file:
      - ./.env
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq/
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    restart: always
    image: nginx:1.31.2
    container_name: nginx
    ports:
      - ${NGINX_HTTP_PORT}:80
      - ${NGINX_HTTPS_PORT}:443
    env_file:
      - ./.env
    environment:
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".conf"
    volumes:
      - ./nginx/nginx.conf.conf:/etc/nginx/nginx.conf.conf:ro
      - ./certs/selfsigned:/etc/nginx/certs:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh
    depends_on:
      - server
#    extra_hosts should be commented when nestjs server is containerized;
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    entrypoint: [ "/entrypoint.sh" ]

volumes:
  db_data:
    driver: local
  db_data_test:
    driver: local
  init:
    driver: local
  redis_data:
    driver: local
  certs:
    driver: local
  rabbitmq_data:
    driver: local
  nginx:
    driver: local
